<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <!-- Outline/Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="50%" stop-color="#ff8800" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>
    <!-- Logo Symbol Gradient -->
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dddddd" />
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ff8800" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" filter="url(#glow)" />

  <!-- Terminal prompt symbols (>_) -->
  <g transform="translate(112, 144)">
    <!-- Greater-than symbol (>) -->
    <path d="M 20 20 L 140 110 L 20 200" fill="none" stroke="url(#borderGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Cursor/Underscore (_) -->
    <line x1="160" y1="200" x2="260" y2="200" stroke="url(#symbolGrad)" stroke-width="28" stroke-linecap="round" />
  </g>
</svg>
